<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NC Quality Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-gray-100 min-h-screen p-4 md:p-6">
    <div class="max-w-7xl mx-auto space-y-6">
        
        <!-- Header -->
        <div class="bg-white p-6 rounded-xl shadow-md flex flex-col md:flex-row justify-between items-center space-y-4 md:space-y-0">
            <div>
                <h1 class="text-2xl md:text-3xl font-bold text-gray-800">📊 NC Quality Dashboard</h1>
                <p class="text-gray-500 text-sm mt-1">รายงานสรุปปัญหางานเสีย/ไม่สอดคล้องตามข้อกำหนด (Real-time)</p>
            </div>
            <div class="text-right">
                <span id="connectionStatus" class="inline-flex items-center px-3 py-1 rounded-full text-xs font-semibold bg-yellow-100 text-yellow-800">
                    🟡 กำลังเชื่อมต่อข้อมูล...
                </span>
                <p class="text-xs text-gray-400 mt-2">อัปเดตล่าสุด: <span id="lastUpdatedTime">-</span></p>
            </div>
        </div>

        <!-- Graphs Grid -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <!-- Pareto Chart -->
            <div class="bg-white p-6 rounded-xl shadow-md">
                <h2 class="text-lg font-bold text-gray-700 mb-4">🏆 Pareto Chart (สาเหตุปัญหา NC)</h2>
                <canvas id="paretoChart"></canvas>
            </div>

            <!-- Dept Chart -->
            <div class="bg-white p-6 rounded-xl shadow-md">
                <h2 class="text-lg font-bold text-gray-700 mb-4">🏢 NC แยกตามแผนก/กระบวนการ</h2>
                <canvas id="deptChart"></canvas>
            </div>

            <!-- Trend Chart -->
            <div class="bg-white p-6 rounded-xl shadow-md">
                <h2 class="text-lg font-bold text-gray-700 mb-4">📈 แนวโน้มปัญหา NC รายเดือน</h2>
                <canvas id="trendChart"></canvas>
            </div>

            <!-- Machine Chart -->
            <div class="bg-white p-6 rounded-xl shadow-md">
                <h2 class="text-lg font-bold text-gray-700 mb-4">⚙️ เครื่องจักรที่พบปัญหามากที่สุด</h2>
                <canvas id="machineChart"></canvas>
            </div>
        </div>
    </div>

    <script>
        // Web App URL ที่ใส่ลิงก์ของคุณให้เรียบร้อยแล้ว
        const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbynGqizdlwa1Se4AkGUlTitiNLzfUC3u--mwarP270DQIkj2mpaUgwmKSVSvnXEk7aX_g/exec';

        let paretoChartInstance, deptChartInstance, trendChartInstance, machineChartInstance;

        async function initDashboard() {
            const statusEl = document.getElementById('connectionStatus');
            const timeEl = document.getElementById('lastUpdatedTime');

            if (!GOOGLE_SCRIPT_URL || GOOGLE_SCRIPT_URL.includes('วาง_WEB_APP_URL_ตรงนี้')) {
                statusEl.innerText = "🔴 ยังไม่ได้ใส่ Web App URL";
                statusEl.className = "inline-flex items-center px-3 py-1 rounded-full text-xs font-semibold bg-red-100 text-red-800";
                renderMock(); 
                return;
            }

            try {
                const res = await fetch(GOOGLE_SCRIPT_URL);
                const data = await res.json();

                statusEl.innerText = "🟢 เชื่อมต่อระบบสำเร็จ";
                statusEl.className = "inline-flex items-center px-3 py-1 rounded-full text-xs font-semibold bg-green-100 text-green-800";
                timeEl.innerText = new Date().toLocaleTimeString('th-TH');

                if (data) {
                    renderPareto(data.paretoLabels || [], data.paretoValues || []);
                    renderDept(data.deptLabels || [], data.deptValues || []);
                    renderTrend(data.trendLabels || [], data.trendValues || []);
                    renderMachine(data.machineLabels || [], data.machineValues || []);
                } else {
                    renderMock();
                }
            } catch (err) {
                console.error("Fetch Error:", err);
                statusEl.innerText = "🔴 ดึงข้อมูลไม่สำเร็จ (แสดงข้อมูลจำลอง)";
                statusEl.className = "inline-flex items-center px-3 py-1 rounded-full text-xs font-semibold bg-red-100 text-red-800";
                renderMock();
            }
        }

        function renderMock() {
            renderPareto(['รอยขูดขีด', 'พิมพ์เลื่อม', 'สีไม่สม่ำเสมอ', 'ไดคัทเบี้ยว', 'กาวไม่ติด'], [15, 12, 8, 5, 3]);
            renderDept(['ประกบ', 'ไดคัท', 'ปะกาว', 'พิมพ์'], [40, 25, 20, 15]);
            renderTrend(['ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.'], [5, 8, 12, 9, 14, 6]);
            renderMachine(['MC-3020', 'MC-3165', 'MC-101', 'MC-205'], [18, 14, 9, 4]);
        }

        function renderPareto(labels, data) {
            if (paretoChartInstance) paretoChartInstance.destroy();
            const ctx = document.getElementById('paretoChart').getContext('2d');
            paretoChartInstance = new Chart(ctx, {
                type: 'bar',
                data: { labels: labels, datasets: [{ label: 'จำนวนครั้ง', data: data, backgroundColor: '#3b82f6' }] },
                options: { responsive: true }
            });
        }

        function renderDept(labels, data) {
            if (deptChartInstance) deptChartInstance.destroy();
            const ctx = document.getElementById('deptChart').getContext('2d');
            deptChartInstance = new Chart(ctx, {
                type: 'pie',
                data: { labels: labels, datasets: [{ data: data, backgroundColor: ['#ef4444', '#f59e0b', '#10b981', '#6366f1', '#8b5cf6'] }] },
                options: { responsive: true }
            });
        }

        function renderTrend(labels, data) {
            if (trendChartInstance) trendChartInstance.destroy();
            const ctx = document.getElementById('trendChart').getContext('2d');
            trendChartInstance = new Chart(ctx, {
                type: 'line',
                data: { labels: labels, datasets: [{ label: 'จำนวน NC', data: data, borderColor: '#10b981', fill: false }] },
                options: { responsive: true }
            });
        }

        function renderMachine(labels, data) {
            if (machineChartInstance) machineChartInstance.destroy();
            const ctx = document.getElementById('machineChart').getContext('2d');
            machineChartInstance = new Chart(ctx, {
                type: 'bar',
                data: { labels: labels, datasets: [{ label: 'จำนวนครั้ง', data: data, backgroundColor: '#8b5cf6' }] },
                options: { indexAxis: 'y', responsive: true }
            });
        }

        window.onload = initDashboard;
    </script>
</body>
</html>
